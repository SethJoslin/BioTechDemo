[project]
name = "openbioops"
version = "0.2.0"
description = "Shared library for OpenBioOps - scRNA-seq processing and ML models"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Seth Joslin"}
]

dependencies = [
    # Core scientific computing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",

    # ML
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",

    # Bioinformatics
    "scanpy>=1.9.0",
    "anndata>=0.8.0",

    # Data formats
    "pyarrow>=12.0.0",

    # Vector search
    "faiss-cpu>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openbioops", "openbioops.models", "openbioops.processing"]

[tool.setuptools.package-data]
openbioops = ["py.typed"]
