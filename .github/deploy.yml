name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (not recommended for production)'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com
  IMAGE_NAME: openbioops-api
  PYTHON_VERSION: '3.11'

jobs:
  # ── Test & Lint ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linting
        run: uv run ruff check services/api/app lib/openbioops

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=services/api/app \
            --cov=lib/openbioops \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Security Scanning ───────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Check for Python vulnerabilities
        run: |
          uv pip install safety
          uv run safety check --json

  # ── Build & Push Docker Image ───────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.security.result == 'success'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ github.event.head_commit.timestamp }}
            VERSION=${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'

  # ── Deploy to Staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.openbioops.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name openbioops-staging \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to Kubernetes
        run: |
          # Update image in deployment
          kubectl set image deployment/api \
            api=${{ needs.build.outputs.image-tag }} \
            -n openbioops

          # Wait for rollout
          kubectl rollout status deployment/api -n openbioops --timeout=5m

      - name: Verify deployment
        run: |
          # Check pod status
          kubectl get pods -n openbioops -l app=api

          # Check health endpoint
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f http://api-service:8000/health/ready

  # ── Integration Tests (Staging) ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e services/api/[test]
          pip install httpx pytest

      - name: Run integration tests against staging
        env:
          API_BASE_URL: https://staging.openbioops.example.com
          API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: |
          pytest tests/integration/ \
            --base-url=$API_BASE_URL \
            --token=$API_TOKEN \
            -v

      - name: Run smoke tests
        run: |
          bash scripts/smoke-test.sh https://staging.openbioops.example.com

  # ── Deploy to Production (Blue-Green) ───────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://openbioops.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name openbioops-production \
            --region ${{ env.AWS_REGION }}

      - name: Prepare Green Deployment
        run: |
          # Get current deployment (blue)
          kubectl get deployment api -n openbioops -o yaml > blue-deployment.yaml

          # Create green deployment
          sed 's/name: api$/name: api-green/' blue-deployment.yaml | \
          sed 's/version: blue$/version: green/' | \
          sed "s|image: .*|image: ${{ needs.build.outputs.image-tag }}|" > green-deployment.yaml

          # Deploy green
          kubectl apply -f green-deployment.yaml -n openbioops

      - name: Wait for Green Deployment
        run: |
          kubectl rollout status deployment/api-green -n openbioops --timeout=10m

          # Verify green is healthy
          kubectl wait --for=condition=ready pod \
            -l app=api,version=green \
            -n openbioops \
            --timeout=300s

      - name: Run Smoke Tests on Green
        run: |
          # Get green service endpoint
          GREEN_ENDPOINT=$(kubectl get svc api-green-service -n openbioops -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          # Run smoke tests
          bash scripts/smoke-test.sh "http://${GREEN_ENDPOINT}"

      - name: Switch Traffic to Green
        run: |
          # Update service selector to point to green
          kubectl patch service api -n openbioops \
            -p '{"spec":{"selector":{"version":"green"}}}'

          echo "Traffic switched to green deployment"

      - name: Monitor Green Deployment
        run: |
          echo "Monitoring green deployment for 5 minutes..."
          sleep 300

          # Check for errors
          ERROR_COUNT=$(kubectl logs -l app=api,version=green -n openbioops --tail=1000 | grep -c ERROR || true)

          if [ $ERROR_COUNT -gt 10 ]; then
            echo "High error rate detected ($ERROR_COUNT errors), rolling back..."
            exit 1
          fi

          echo "Green deployment is healthy"

      - name: Scale Down Blue Deployment
        if: success()
        run: |
          # Scale down old blue deployment
          kubectl scale deployment/api --replicas=0 -n openbioops

          echo "Blue deployment scaled down. Green is now serving all traffic."

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Rolling back to blue deployment..."

          # Switch traffic back to blue
          kubectl patch service api -n openbioops \
            -p '{"spec":{"selector":{"version":"blue"}}}'

          # Scale down green
          kubectl scale deployment/api-green --replicas=0 -n openbioops

          echo "Rollback complete. Blue deployment is serving traffic."

      - name: Notify Success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": " Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful*\n\nCommit: ${{ github.sha }}\nImage: ${{ needs.build.outputs.image-tag }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": " Production deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed*\n\nCommit: ${{ github.sha }}\nRolled back to previous version."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}