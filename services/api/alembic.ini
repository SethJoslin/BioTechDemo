# Alembic Configuration for OpenBioOps API

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision names
truncate_slug_length = 40

# Timezone for file_template (default is local time)
# timezone = UTC

# Set to 'true' to run the environment during autogenerate
# to prevent autogenerate from collecting tables outside the target metadata
# prepend_sys_path = .

# SQLAlchemy URL - overridden by env.py from settings
sqlalchemy.url = sqlite:///./data/runs.db

[post_write_hooks]
# Format using ruff after generating
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
