[project]
name = "openbioops-api"
version = "0.2.0"
description = "OpenBioOps FastAPI backend for scRNA-seq analysis"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Seth Joslin"}
]

dependencies = [
    # Workspace dependencies
    "openbioops",

    # Core API
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",

    # Data processing
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "numpy>=1.24.0",

    # ML / Bioinformatics
    "faiss-cpu>=1.7.4",
    "scanpy>=1.9.0",
    "anndata>=0.8.0",
    "scikit-learn>=1.3.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Async task queue
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",

    # Observability
    "prometheus-client>=0.18.0",

    # HTTP client
    "httpx>=0.24.0",

    # ML tracking
    "mlflow>=2.8.0",

    # Utilities
    "python-multipart>=0.0.6",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",

    # Linting & formatting
    "ruff>=0.1.0",
    "mypy>=1.6.0",

    # Type stubs
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
]

[tool.uv.sources]
openbioops = { workspace = true }

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["py.typed"]
