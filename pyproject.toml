[project]
name = "openbioops-ml"
version = "0.2.0"
description = "Full-stack bioinformatics platform for scRNA-seq analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Seth Joslin"}
]
keywords = ["bioinformatics", "scRNA-seq", "single-cell", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Root project dependencies
dependencies = [
    # Workspace members
    "openbioops",
    "openbioops-api",

    # ML and data processing
    "torch>=2.2.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "umap-learn>=0.5.6",
    "matplotlib>=3.8.0",
    "pyarrow>=15.0.0",
    "mlflow>=2.8.0",
    "scanpy>=1.9.0",
]

[project.urls]
Repository = "https://github.com/SethJoslin/BioTechDemo"

# ── Workspace Config ──────────────────────────────────────────────────

# Declares this as a uv workspace
[tool.uv.workspace]
members = ["lib", "services/api"]

[tool.uv.sources]
openbioops = { workspace = true }
openbioops-api = { workspace = true }


[project.optional-dependencies]
# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

# Snowflake data warehouse integration
snowflake = [
    "snowflake-connector-python>=3.0.0",
]

# Install everything (all optional features)
all = [
    "snowflake-connector-python>=3.0.0",
]

# ── Ruff (linter + formatter) ──────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    ".nextflow",
    "work",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI uses this)
    "B905",   # zip without strict= (Python 3.10+)
    "ARG001", # unused function argument (common in FastAPI dependencies)
]

[tool.ruff.lint.isort]
known-first-party = ["openbioops", "app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── Mypy (type checking) ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Start permissive, tighten over time
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "node_modules",
    "work",
]

[[tool.mypy.overrides]]
module = [
    "faiss",
    "scanpy",
    "anndata",
    "mlflow",
    "celery",
    "snowflake.*",
]
ignore_missing_imports = true

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api", "lib", "ml", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Avoid collecting tests from multiple directories with same name
norecursedirs = [
    ".git", ".venv", "venv", "node_modules", "build", "dist", "*.egg",
    "services", "api", "snowflake_integration", "pipelines", "infra", "ml"
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=services/api/app",
    "--cov=lib/openbioops",
    "--cov=ml",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--import-mode=importlib",
]
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests",
    "e2e: End-to-end tests (slow)",
    "slow: Slow tests",
    "requires_model: Requires trained model",
    "benchmark: Performance benchmarks",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ── Coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["services/api/app", "lib/openbioops", "ml"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "except ImportError:",
]
fail_under = 40  # Temporarily lowered while fixing tests, increase to 70%+
show_missing = true
skip_empty = true
